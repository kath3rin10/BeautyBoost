spring.application.name=Beauty Boost

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3308/script_beauty_boost?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Bogota}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Server
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.session.timeout=30m

# Wompi
wompi.public-key=${WOMPI_PUBLIC_KEY:}
wompi.integrity-secret=${WOMPI_INTEGRITY_SECRET:}
wompi.events-secret=${WOMPI_EVENTS_SECRET:}
wompi.api-url=${WOMPI_API_URL:https://sandbox.wompi.co/v1}

# Correo SMTP Beauty Boost
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:store.beautyboost@gmail.com}
spring.mail.password=${MAIL_PASSWORD:axfvdwywpaotoqzo}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
