<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Beauty Boost | Recuperar contraseña</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="recover-page">
<main class="recover-shell">
    <section class="recover-card">
        <div class="recover-brand">
            <img src="https://res.cloudinary.com/rzxmfg9i/image/upload/v1789523154/logo.png" alt="Beauty Boost" onerror="this.style.display='none'">
            <h1>BEAUTY BOOST</h1>
        </div>
        <p class="recover-kicker">Seguridad de tu cuenta</p>
        <h2 class="recover-title">Recuperar Contraseña</h2>
        <p class="recover-desc">Ingresa el correo con el que te registraste para generar una nueva contraseña temporal.</p>

        <div id="recoverSuccessBox" style="display:none;" class="recover-alert success">
            <i class="fas fa-check"></i> <span id="recoverSuccessText"></span>
        </div>
        <div id="recoverErrorBox" style="display:none;" class="recover-alert error">
            <i class="fas fa-circle-exclamation"></i> <span id="recoverErrorText"></span>
        </div>

        <form id="recoverForm">
            <div class="recover-form-group">
                <label class="recover-label" for="txtCorreo">Correo electrónico</label>
                <input class="recover-input" id="txtCorreo" type="email" name="txtCorreo" required placeholder="ejemplo@gmail.com">
            </div>
            <button id="btnRecoverSubmit" class="btn-recover-submit" type="submit"><i class="fas fa-paper-plane"></i> &nbsp;Generar contraseña temporal</button>
        </form>

        <div id="recoverActionsAfter" style="display:none; margin-top: 15px;">
            <a class="btn-recover-submit" style="display:block;text-align:center;text-decoration:none;box-sizing:border-box; margin-bottom: 10px;" th:href="@{/login}">IR A INICIAR SESIÓN</a>
        </div>

        <div class="recover-help"><i class="fas fa-shield-halved"></i><span>Por seguridad, la nueva contraseña temporal solo se genera para correos registrados.</span></div>
        <a class="recover-back" th:href="@{/login}">← Volver a iniciar sesión</a>
    </section>
</main>

<script>
    document.getElementById('recoverForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const correo = document.getElementById('txtCorreo').value.trim();
        const successBox = document.getElementById('recoverSuccessBox');
        const errorBox = document.getElementById('recoverErrorBox');
        const submitBtn = document.getElementById('btnRecoverSubmit');
        successBox.style.display = 'none';
        errorBox.style.display = 'none';

        if (!correo) {
            document.getElementById('recoverErrorText').textContent = 'Ingresa un correo válido.';
            errorBox.style.display = 'block';
            return;
        }

        submitBtn.disabled = true;
        try {
            const resp = await fetch('/api/usuario/recuperar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ correo: correo })
            });
            const data = await resp.json();
            if (!resp.ok || data.status !== 'success') {
                throw new Error(data.error || 'No se pudo procesar la recuperación.');
            }
            document.getElementById('recoverSuccessText').textContent = data.mensaje || '¡Nueva contraseña generada y enviada con éxito! Revisa tu correo.';
            successBox.style.display = 'block';
            document.getElementById('recoverForm').style.display = 'none';
            document.getElementById('recoverActionsAfter').style.display = 'block';
        } catch (err) {
            document.getElementById('recoverErrorText').textContent = err.message;
            errorBox.style.display = 'block';
            submitBtn.disabled = false;
        }
    });
</script>
</body>
</html>
