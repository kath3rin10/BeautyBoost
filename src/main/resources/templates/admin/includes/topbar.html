<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="bb-topbar" th:fragment="topbar(tituloAdmin)">
    <div class="bb-topbar-left">
        <button class="bb-menu" type="button" id="bbMenu" aria-label="Abrir menú">
            <i class="fas fa-bars"></i>
        </button>
        <div>
            <small>BEAUTY BOOST</small>
            <h1 th:text="${tituloAdmin}">Panel Administrativo</h1>
        </div>
    </div>

    <div class="bb-topbar-right">
        <label class="bb-search" for="adminSearch">
            <i class="fas fa-search"></i>
            <input id="adminSearch" type="search" placeholder="Buscar en esta sección..." autocomplete="off">
        </label>

        <a class="bb-profile-link"
           th:href="${session.usuarioLogueado != null} ? @{/admin/usuarios/perfil(id=${session.usuarioLogueado.idUsuario})} : @{/admin/usuarios}"
           title="Ver mi perfil">
            <i class="fas fa-user-circle"></i>
            <span th:text="${session.usuarioLogueado != null ? session.usuarioLogueado.nombre : 'Admin'}">Admin</span>
        </a>
    </div>
</header>
</body>
</html>
